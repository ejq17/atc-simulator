name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the Playwright end-to-end suite (installs Chromium)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run fetch-charts
      - run: npm run build
        env:
          GITHUB_PAGES: '1'

  # Manual only for now: needs a browser, and several specs need the local backend or network access.
  # Run it from the Actions tab (Run workflow, tick "e2e"). Builds once, then runs the suite against
  # `vite preview` (E2E_PREVIEW=1), the same mode the playwright.config.ts header describes.
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --project=chromium
        env:
          CI: 'true'
          E2E_PREVIEW: '1'
          E2E_PORT: '5174'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
